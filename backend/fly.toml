# Fly.io configuration for the SnapNotes backend. See DEPLOY.md for the full walkthrough.
# Run all `fly` commands from this folder.

# Fly app names are global: change this to something unique to you before deploying.
app = "snapnotes-change-me"
primary_region = "iad"

# uvicorn shuts down cleanly on SIGTERM. The job worker waits up to 30 s for running jobs, so allow a little longer.
kill_signal = "SIGTERM"
kill_timeout = 35

[build]
  dockerfile = "Dockerfile"

[env]
  SNAPNOTES_DATA_DIR = "/data"
  SNAPNOTES_DOCS = "0"
  # Spend limits (defaults shown). Secrets such as SNAPNOTES_TOKEN and ANTHROPIC_API_KEY are NOT set here:
  # use `fly secrets set` so they never end up in this file.
  SNAPNOTES_MAX_JOBS_PER_HOUR = "10"
  SNAPNOTES_MAX_JOB_COST_USD = "2.0"

# The SQLite database and any uploads in flight live on this volume (create it first: see DEPLOY.md).
# A volume belongs to one machine, so this app runs as exactly one machine.
[mounts]
  source = "snapnotes_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep the machine running. If Fly stopped it while a document was being processed, that job would restart from the
  # beginning of its phase and its AI cost would be paid twice.
  auto_stop_machines = "off"
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# Preparing one maximum-size (30 MB) PDF takes ~150 MB on top of ~120 MB for the idle server, so 512 MB was too tight.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
