[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "snapnotes-backend"
version = "0.1.0"
description = "SnapNotes backend: turns notes plus web sources into flashcards"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.1",
    "fastapi>=0.115",
    "genanki>=0.13",
    "google-genai>=2.33",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0",
    "rapidfuzz>=3.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
